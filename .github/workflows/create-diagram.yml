name: Update Repo Diagram

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - diagram.svg

permissions:
  contents: write

jobs:
  visualize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate repository diagram
        uses: githubocto/repo-visualizer@0.7.1
        with:
          output_file: diagram.svg
          excluded_paths: node_modules,frontend/build,backend/data,.git
          max_depth: 4
          commit_message: "docs: update repository diagram [skip ci]"
